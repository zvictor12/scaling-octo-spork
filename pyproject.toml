[project]
name = "amoeba-model"
version = "0.1.0"
description = "Численная модель скопления амёб"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.13,<2", "matplotlib>=3.9,<4", "pyyaml>=6,<7", "sympy>=1.13,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
amoeba-experiments = "amoeba_model.experiments:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amoeba_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
